<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>probe-llm - perguntar ao modelo</title>
    <link rel="stylesheet" href="/static/perf.css">
</head>

<body>
    <h1>Perguntar ao modelo</h1>
    <div class="sub">Modelo: <code>{{ model }}</code> &middot; Endpoint: <code>{{ url }}</code></div>
    <textarea id="q" placeholder="Escreva sua pergunta aqui..."></textarea>
    <div class="row">
        <button id="go">Perguntar</button>
        <label><input type="checkbox" id="think"> pensar antes (thinking)</label>
        <span class="meta" id="status"></span>
    </div>
    <pre id="a">A resposta aparece aqui.</pre>
    <details id="thWrap" style="display:none">
        <summary>raciocinio do modelo (thinking)</summary>
        <pre id="th"></pre>
    </details>
    <script>
        const $ = id => document.getElementById(id);
        async function ask() {
            const q = $('q').value.trim(); if (!q) { $('status').textContent = 'Digite uma pergunta.'; return; }
            $('go').disabled = true; $('status').textContent = 'Pensando...'; $('a').textContent = ''; $('thWrap').style.display = 'none';
            const t0 = Date.now();
            try {
                const r = await fetch('/api/ask', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: q, think: $('think').checked })
                });
                const d = await r.json();
                const secs = ((Date.now() - t0) / 1000).toFixed(1);
                if (d.ok) {
                    $('a').textContent = d.response || '(resposta vazia)';
                    if (d.thinking) { $('th').textContent = d.thinking; $('thWrap').style.display = 'block'; }
                    $('status').textContent = 'OK em ' + secs + 's' + (d.ms ? (' (' + d.ms + 'ms no servidor)') : '');
                } else {
                    $('a').innerHTML = '<span class="err">Falhou: ' + (d.error || d.reason || ('HTTP ' + (d.status || '?'))) + '</span>';
                    if (d.error_body) $('th').textContent = d.error_body, $('thWrap').style.display = 'block';
                    $('status').textContent = 'erro';
                }
            } catch (e) { $('a').innerHTML = '<span class="err">Erro de rede: ' + e + '</span>'; $('status').textContent = 'erro'; }
            finally { $('go').disabled = false; }
        }
        $('go').onclick = ask;
        $('q').addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') ask(); });
    </script>
</body>

</html>
